/**:
  ros__parameters:
    # Image size
    image_width: 1280
    image_height: 720

    # Intrinsic matrix parameters
    camera_matrix:
      fx: 700.0
      fy: 700.0
      cx: 640.0
      cy: 360.0

    # Distortion coefficients (radial: k1,k2,k3; tangential: p1,p2)
    distortion_coefficients:
      k1: 0.0
      k2: 0.0
      p1: 0.0
      p2: 0.0
      k3: 0.0

    # Optional: override frame id of camera info
    override_frame_id: ""

