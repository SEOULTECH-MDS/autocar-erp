# kcity 맵 기반 Lane ID와 미션 매핑 설정
# 각 미션별로 활성화될 lane ID 범위를 정의합니다.
# 다중 구간 및 단일 lane 설정을 지원합니다.

mission_mapping:
  # 신호등 탐지 미션 (교차로 구간)
  trafficlight:
    - start: 5
      end: 5     
    - start: 7
      end: 7
    - start: 10
      end: 10     
    # - start: 12
    #   end: 12
    - start: 15
      end: 15
    - start: 16
      end: 16
    - start: 20
      end: 20
    - start: 22
      end: 22
    
  # 표지판 탐지 미션 (배달 구역)  
  sign:
    - start: 1    # 배달A
      end: 2
    - start: 19   # 배달B
      end: 19      
    
  # 장애물 탐지 미션 (장애물 회피 구간)
  obstacle:
    - start: 9    # 대형 정적장애물
      end: 9      
    - start: 24    # 소형 정적장애물
      end: 25
    # - start: 1    # 소형 정적장애물 (아름관 우측 직선 구간)
    #   end: 1


  # 라바콘 탐지 미션 (주차 구간)
  rubber:
    - start: 27
      end: 27
      # - start: 1    # 주차 (아름관 우측 직선 구간)
      #   end: 8

# 추가 설정
settings:
  # enable 신호 발행 주기 (Hz) - 장애물 탐지 딜레이 개선을 위해 30Hz로 증가
  publish_rate: 30.0
  
  # 디버그 모드 (상세 로그 출력)
  debug_mode: false
  
  # 미션 전환시 지연 시간 (초) - 더 빠른 반응을 위해 감소
  transition_delay: 0.1

# 주의사항 및 설정 가이드:
# 1. 다중 구간 설정: 각 미션에 여러 구간을 리스트로 정의 가능
# 2. 단일 lane 설정: start와 end를 같게 설정하여 특정 lane에서만 활성화
# 3. lane ID 범위는 겹치지 않도록 설정 권장 (단, 다른 미션 간에는 겹쳐도 됨)
# 4. kcity 맵의 실제 lane numbering에 맞춰 수정하세요
# 5. localization 노드에서 /current_lane_id 토픽을 발행해야 합니다
# 
# 설정 형태 예시:
# 단일 구간: [{"start": 10, "end": 15}]
# 다중 구간: [{"start": 10, "end": 15}, {"start": 20, "end": 25}] 
# 단일 lane: [{"start": 25, "end": 25}]
