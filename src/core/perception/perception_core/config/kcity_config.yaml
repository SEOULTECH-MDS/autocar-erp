# kcity 맵 기반 Lane ID와 미션 매핑 설정
# 각 미션별로 활성화될 lane ID 범위를 정의합니다.
# 다중 구간 및 단일 lane 설정을 지원합니다.

mission_mapping:
  # 신호등 탐지 미션 (교차로 구간)
  trafficlight:
    - start: 10    # 첫 번째 교차로 구간
      end: 15      
      description: "메인 교차로 신호등 인식"
    - start: 45    # 두 번째 교차로 구간  
      end: 47
      description: "보조 교차로 신호등 인식"
    
  # 표지판 탐지 미션 (배달 구역)  
  sign:
    - start: 20    # 배달 구역
      end: 25      
      description: "배달 표지판 인식 구간"
    
  # 장애물 탐지 미션 (장애물 회피 구간)
  obstacle:
    - start: 35    # 대형 장애물
      end: 35      
      description: "대형 장애물 인식 구간"
    - start: 38    # 소형 장애물
      end: 40
      description: "소형 장애물 인식 구간"
    
  # 라바콘 탐지 미션 (주차 구간)
  rubber:
    - start: 50    # 주차 구간
      end: 55
      description: "주차 라바콘 인식"

# 추가 설정
settings:
  # enable 신호 발행 주기 (Hz)
  publish_rate: 10.0
  
  # 디버그 모드 (상세 로그 출력)
  debug_mode: false
  
  # 미션 전환시 지연 시간 (초)
  transition_delay: 0.5

# 주의사항 및 설정 가이드:
# 1. 다중 구간 설정: 각 미션에 여러 구간을 리스트로 정의 가능
# 2. 단일 lane 설정: start와 end를 같게 설정하여 특정 lane에서만 활성화
# 3. lane ID 범위는 겹치지 않도록 설정 권장 (단, 다른 미션 간에는 겹쳐도 됨)
# 4. kcity 맵의 실제 lane numbering에 맞춰 수정하세요
# 5. localization 노드에서 /current_lane_id 토픽을 발행해야 합니다
# 
# 설정 형태 예시:
# 단일 구간: [{"start": 10, "end": 15}]
# 다중 구간: [{"start": 10, "end": 15}, {"start": 20, "end": 25}] 
# 단일 lane: [{"start": 25, "end": 25}]
